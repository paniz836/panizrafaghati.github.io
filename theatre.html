
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Theater Collection | PAR</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fff;
    color: #111;
    font-family: "DM Sans", sans-serif;
}

/* HEADER */

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 85px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 22px;
    z-index: 100;
}

.logo img {
    width: 75px;
    height: 75px;
    object-fit: contain;
    filter: brightness(0);
    display: block;
}

.menu-button {
    width: 34px;
    height: 30px;
    padding: 4px 2px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
}

.menu-button span {
    display: block;
    width: 28px;
    height: 2px;
    background: #111;
    border-radius: 2px;
}

.menu {
    display: none;
    position: absolute;
    top: 75px;
    right: 15px;
    left: 15px;
    background: #fff;
    border: 1px solid #ccc;
    padding: 8px 18px;
    z-index: 20;
}

.menu.open {
    display: block;
}

.menu nav {
    display: flex;
    flex-direction: column;
}

.menu a {
    display: block;
    width: 100%;
    color: #111;
    text-decoration: none;
    text-align: center;
    font-family: "DM Sans", sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.2px;
    padding: 13px 8px;
    border-bottom: 1px solid #ddd;
}

.menu a:last-child {
    border-bottom: none;
}

/* MAIN */

main {
    padding: 112px 28px 100px;
    max-width: 1500px;
    margin: 0 auto;
}

/* TITLE */

.page-title {
    text-align: center;
    margin-bottom: 42px;
}

.page-title h1 {
    font-family: "DM Sans", sans-serif;
    font-size: 23px;
    font-weight: 400;
    letter-spacing: 0.3px;
}

.page-title div {
    width: 76px;
    height: 1px;
    background: #222;
    margin: 13px auto 0;
}

/* GALLERY */

.gallery {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    column-gap: 20px;
    row-gap: 48px;
}

.work {
    min-width: 0;
}

.work-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 0.7px solid #777;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #fff;
}

.work-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.work h2 {
    font-family: "DM Sans", sans-serif;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.45;
    letter-spacing: 0.1px;
    margin-top: 10px;
}

/* FOOTER */

footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 48px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

footer p {
    font-family: "DM Sans", sans-serif;
    font-size: 10px;
    letter-spacing: 3.5px;
    font-weight: 400;
}

/* MOBILE */

@media (max-width: 650px) {

    header {
        height: 75px;
        padding: 8px 18px;
    }

    .logo img {
        width: 66px;
        height: 66px;
    }

    .menu-button {
        width: 34px;
        height: 28px;
    }

    .menu-button span {
        width: 28px;
        height: 2px;
    }

    .menu {
        top: 68px;
        right: 12px;
        left: 12px;
    }

    main {
        padding: 91px 16px 85px;
    }

    .page-title {
        margin-bottom: 32px;
    }

    .page-title h1 {
        font-size: 20px;
    }

    .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 13px;
        row-gap: 34px;
    }

    .work h2 {
        font-size: 14px;
        line-height: 1.4;
        margin-top: 8px;
    }

    footer {
        height: 42px;
    }

    footer p {
        font-size: 9px;
        letter-spacing: 3px;
    }
}
</style>
</head>

<body>

<header>
    <a class="logo" href="index.html">
        <img src="par-logo.png" alt="PAR">
    </a>

    <div class="menu-button" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <nav class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="projects.html">Personal Projects</a>
        <a href="events.html">Events</a>
        <a href="theatre.html">Theater</a>
        <a href="music.html">Music</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

    <div class="page-title">
        <h1>Theater Collection</h1>
        <div></div>
    </div>

    <section class="gallery">

        <article class="work">
            <div class="work-image">
                <img src="images/theatre-1.jpg" alt="Chaos Particles">
            </div>
            <h2>Chaos Particles</h2>
        </article>

        <article class="work">
            <div class="work-image">
                <img src="images/theatre-2.jpg" alt="Star">
            </div>
            <h2>Star</h2>
        </article>

        <article class="work">
            <div class="work-image">
                <img src="images/theatre-3.jpg" alt="Killer Green">
            </div>
            <h2>Killer Green</h2>
        </article>

        <article class="work">
            <div class="work-image">
                <img src="images/theatre-4.jpg" alt="Controversy over the shadow of a donkey">
            </div>
            <h2>Controversy over the shadow of a donkey</h2>
        </article>

        <article class="work">
            <div class="work-image">
                <img src="images/theatre-5.jpg" alt="Ramulus The Great">
            </div>
            <h2>Ramulus The Great</h2>
        </article>

    </section>

</main>

<footer>
    <p>PANIZ RAFAGHATI</p>
</footer>

<script>
function toggleMenu() {
    document.getElementById("menu").classList.toggle("open");
}
</script>

</body>
</html>
