
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Paniz Rafaghati</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #eeeeee;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 7%;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      min-height: 590px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
    }

    .photo {
      position: relative;
      min-height: 590px;
      background: #ccc;
      overflow: hidden;
    }

    .photo img.portrait {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      object-fit: cover;
      object-position: center 35%;
    }

    .photo-logo {
      position: absolute;
      top: 35px;
      left: 35px;
      width: 65px;
      height: auto;
      max-height: 75px;
      object-fit: contain;
      z-index: 2;
    }

    .contact-panel {
      background: #050505;
      color: #fff;
      padding: 65px 13%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .brand {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 55px;
    }

    .contact-panel h1 {
      font-size: 34px;
      font-weight: 500;
      margin-bottom: 25px;
    }

    .intro {
      color: #999;
      font-size: 12px;
      line-height: 1.9;
      margin-bottom: 35px;
      max-width: 300px;
    }

    .contact-info h2 {
      font-size: 17px;
      margin-bottom: 22px;
    }

    .contact-info a,
    .contact-info p {
      display: block;
      color: #aaa;
      font-size: 12px;
      line-height: 2.4;
      text-decoration: none;
      transition: color .3s;
    }

    .contact-info a:hover {
      color: #fff;
    }

    .social {
      margin-top: 35px;
    }

    .social-title {
      font-size: 11px;
      color: #888;
      margin-bottom: 12px;
    }

    .back {
      position: absolute;
      top: 30px;
      right: 30px;
      color: white;
      text-decoration: none;
      font-size: 20px;
    }

    .back:hover {
      opacity: .6;
    }

    .copyright {
      color: #666;
      font-size: 10px;
      margin-top: 45px;
    }

    @media (max-width: 700px) {
      body {
        padding: 25px 15px;
      }

      .page {
        grid-template-columns: 1fr;
      }

      .photo {
        min-height: 420px;
      }

      .photo-logo {
        top: 25px;
        left: 25px;
        width: 55px;
      }

      .contact-panel {
        min-height: 520px;
        padding: 65px 35px;
      }

      .brand {
        margin-bottom: 35px;
      }

      .contact-panel h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="photo">
      <img class="portrait" src="contact.jpg" alt="Paniz Rafaghati portrait">

      <img class="photo-logo" src="par-logo.png" alt="PAR Logo">
    </section>

    <section class="contact-panel">

      <a href="index.html" class="back" aria-label="Back to home">×</a>

      <div class="brand">PAR — PANIZ RAFAGHATI</div>

      <h1>contact</h1>

      <p class="intro">
        For collaborations, photography assignments
        and inquiries, please feel free to get in touch.
      </p>

      <div class="contact-info">

        <h2>Paniz Rafaghati</h2>

        <a href="mailto:panizrefaghati@gmail.com">
          panizrefaghati@gmail.com
        </a>

        <a href="tel:+989336421400">
          +98 933 642 1400
        </a>

        <p>Tehran, Iran</p>

      </div>

      <div class="social">

        <p class="social-title">Find me online</p>

        <a href="https://www.instagram.com/parmedial/"
           target="_blank" rel="noopener noreferrer">
          Instagram — @parmedial
        </a>

        <a href="https://www.linkedin.com/in/paniz-refaghati-761a1532b/"
           target="_blank" rel="noopener noreferrer">
          LinkedIn — Paniz Rafaghati
        </a>

      </div>

      <div class="copyright">
        © 2026 Paniz Rafaghati
      </div>

    </section>

  </main>

</body>
</html>
