
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Paniz Rafaghati</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #eeeeee;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 7%;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      min-height: 590px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
    }

    .photo {
      position: relative;
      min-height: 590px;
      background: #ccc;
      overflow: hidden;
    }

    .photo img.portrait {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      object-fit: cover;
      object-position: center 35%;
    }

    .photo-logo {
      position: absolute;
      top: 35px;
      left: 35px;
      width: 100px;
      height: auto;
      max-height: 110px;
      object-fit: contain;
      z-index: 2;
    }

    .contact-panel {
      background: #050505;
      color: #fff;
      padding: 65px 13%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .panel-content {
      transform: translateY(-8px);
    }

    .contact-panel h1 {
      font-size: 34px;
      font-weight: 500;
      margin-bottom: 25px;
    }

    .intro {
      color: #999;
      font-size: 12px;
      line-height: 1.9;
      margin-bottom: 35px;
      max-width: 300px;
    }

    .contact-info h2 {
      font-size: 17px;
      margin-bottom: 22px;
    }

    .contact-info a,
    .contact-info p {
      display: block;
      color: #aaa;
      font-size: 12px;
      line-height: 2.4;
      text-decoration: none;
      transition: color .3s;
    }

    .contact-info a:hover {
      color: #fff;
    }

    .social {
      margin-top: 35px;
    }

    .social-title {
      font-size: 11px;
      color: #888;
      margin-bottom: 16px;
    }

    .social-icons {
      display: flex;
      align-items: center;
      gap: 19px;
    }

    .social-icons a {
      width: 23px;
      height: 23px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      transition: opacity .3s ease;
    }

    .social-icons a:hover {
      opacity: .55;
    }

    .social-icons svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .back {
      position: absolute;
      top: 30px;
      right: 30px;
      color: white;
      text-decoration: none;
      font-size: 20px;
    }

    .back:hover {
      opacity: .6;
    }

    .copyright {
      color: #666;
      font-size: 10px;
      margin-top: 45px;
    }

    @media (max-width: 700px) {
      body {
        padding: 25px 15px;
      }

      .page {
        grid-template-columns: 1fr;
      }

      .photo {
        min-height: 420px;
      }

      .photo-logo {
        top: 25px;
        left: 25px;
        width: 80px;
        max-height: 90px;
      }

      .contact-panel {
        min-height: 520px;
        padding: 65px 35px;
      }

      .panel-content {
        transform: translateY(-5px);
      }

      .contact-panel h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="photo">
      <img class="portrait" src="contact.jpg" alt="Paniz Rafaghati portrait">
      <img class="photo-logo" src="par-logo.png" alt="PAR Logo">
    </section>

    <section class="contact-panel">

      <a href="index.html" class="back" aria-label="Back to home">×</a>

      <div class="panel-content">

        <h1>contact</h1>

        <p class="intro">
          For collaborations, photography assignments
          and inquiries, please feel free to get in touch.
        </p>

        <div class="contact-info">

          <h2>Paniz Rafaghati</h2>

          <a href="mailto:panizrefaghati@gmail.com">
            panizrefaghati@gmail.com
          </a>

          <a href="tel:+989336421400">
            +98 933 642 1400
          </a>

          <p>Tehran, Iran</p>

        </div>

        <div class="social">

          <p class="social-title">Find me online</p>

          <div class="social-icons">

            <a href="https://www.instagram.com/parmedial/"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Instagram">

              <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="5"/>
                <circle cx="12" cy="12" r="4"/>
                <circle cx="17.5" cy="6.5" r="0.8"
                        fill="currentColor" stroke="none"/>
              </svg>

            </a>

            <a href="https://www.linkedin.com/in/paniz-refaghati-761a1532b/"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="LinkedIn">

              <svg viewBox="0 0 24 24">
                <path d="M4 9v11"/>
                <path d="M4 4.5v.1"/>
                <path d="M9 20v-11h4v1.7"/>
                <path d="M13 14.5c0-3.5 6-3.8 6 0V20"/>
                <path d="M19 14.5V20"/>
                <circle cx="4" cy="4.5" r="1.2"/>
              </svg>

            </a>

          </div>

        </div>

        <div class="copyright">
          © 2026 Paniz Rafaghati
        </div>

      </div>

    </section>

  </main>

</body>
</html>
