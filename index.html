
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PAR | Photography by Paniz Rafaghati</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
        }

        /* Main page */

        .home {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #000;
        }

        /* Slideshow */

        .slideshow {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .slide.active {
            opacity: 1;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 2;
        }

        /* Header */

        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo img {
            width: 90px;
            height: auto;
            display: block;
        }

        /* Navigation */

        nav {
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            gap: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            white-space: nowrap;
            transition: opacity 0.3s ease;
        }

        nav a:hover {
            opacity: 0.6;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .home {
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                background: #000;
            }

            /* Top black bar */

            header {
                position: relative;
                top: auto;
                left: auto;
                order: 0;
                flex: 0 0 auto;
                width: 100%;
                padding: 12px 4%;
                background: #000;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 8px;
            }

            .logo img {
                width: clamp(38px, 10vw, 58px);
            }

            /* One-line menu */

            nav {
                display: flex;
                flex-wrap: nowrap;
                align-items: center;
                justify-content: flex-end;
                gap: clamp(5px, 1.8vw, 12px);
                flex: 1;
                min-width: 0;
            }

            nav a {
                font-size: clamp(7px, 1.8vw, 10px);
                letter-spacing: 0;
                white-space: nowrap;
            }

            /* Full-width photo area */

            .slideshow {
                position: relative;
                inset: auto;
                order: 1;
                width: 100%;
                aspect-ratio: 16 / 9;
                flex: 0 0 auto;
                background: #000;
            }

            .slide {
                position: absolute;
                inset: 0;
                background-size: contain;
                background-position: center;
                background-repeat: no-repeat;
            }

            /* Keep the black areas clean */

            .overlay {
                display: none;
            }
        }

        /* VERY SMALL PHONES */

        @media (max-width: 360px) {

            header {
                padding: 10px 3%;
                gap: 5px;
            }

            .logo img {
                width: 36px;
            }

            nav {
                gap: 5px;
            }

            nav a {
                font-size: 7px;
                letter-spacing: -0.2px;
            }
        }

    </style>
</head>

<body>

    <main class="home">

        <div class="slideshow">

            <div class="slide active"
                 style="background-image: url('images/home1.jpg');"></div>

            <div class="slide"
                 style="background-image: url('images/home2.jpg');"></div>

            <div class="slide"
                 style="background-image: url('images/home3.jpg');"></div>

            <div class="slide"
                 style="background-image: url('images/home4.jpg');"></div>

            <div class="slide"
                 style="background-image: url('images/home5.jpg');"></div>

        </div>

        <div class="overlay"></div>

        <header>

            <a class="logo" href="index.html">
                <img src="logo.png" alt="PAR Logo">
            </a>

            <nav>
                <a href="index.html">Home</a>
                <a href="theatre.html">Theatre</a>
                <a href="projects.html">Project</a>
                <a href="about.html">About</a>
                <a href="https://paniz836.github.io/panizrafaghati.github.io/contact.html">Contact</a>
            </nav>

        </header>

    </main>

    <script>
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;

        setInterval(() => {
            slides[currentSlide].classList.remove('active');

            currentSlide = (currentSlide + 1) % slides.length;

            slides[currentSlide].classList.add('active');
        }, 3000);
    </script>

</body>
</html>
