<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PAR | Photography by Paniz Rafaghati</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* HOME */
        .home {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }

        /* SLIDESHOW */
        .slideshow {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 1.2s ease-in-out;
        }

        .slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* DARK OVERLAY */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.15);
            z-index: 2;
            pointer-events: none;
        }

        /* NAVIGATION */
        nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 28px 45px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            z-index: 10;
        }

        /* LOGO */
        .logo img {
            display: block;
            width: 90px;
            height: auto;
        }

        /* MENU */
        .menu {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 1px;
            transition: opacity 0.3s ease;
        }

        .menu a:hover {
            opacity: 0.55;
        }

        /* MOBILE */
        @media (max-width: 700px) {

            nav {
                padding: 20px;
            }

            .logo img {
                width: 65px;
            }

            .menu {
                gap: 14px;
            }

            .menu a {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <main class="home">

        <!-- NAVIGATION -->
        <nav>

            <a href="#" class="logo">
                <img src="logo.png" alt="PAR Logo">
            </a>

            <ul class="menu">
                <li><a href="#">Home</a></li>
                <li><a href="#">Theater</a></li>
                <li><a href="#">Project</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

        </nav>


        <!-- SLIDESHOW -->
        <div class="slideshow" id="slideshow">

            <img src="images/home1.jpg" class="slide" alt="Paniz Rafaghati Photography">

            <img src="images/home2.jpg" class="slide" alt="Paniz Rafaghati Photography">

            <img src="images/home3.jpg" class="slide" alt="Paniz Rafaghati Photography">

            <img src="images/home4.jpg" class="slide" alt="Paniz Rafaghati Photography">

            <img src="images/home5.jpg" class="slide" alt="Paniz Rafaghati Photography">

        </div>

        <div class="overlay"></div>

    </main>


    <script>

        const slideshow = document.getElementById("slideshow");

        const slides = document.querySelectorAll(".slide");

        let currentSlide = 0;

        function nextSlide() {

            currentSlide++;

            if (currentSlide >= slides.length) {
                currentSlide = 0;
            }

            slideshow.style.transform =
                "translateX(-" + (currentSlide * 100) + "%)";
        }

        /* Change image every 3 seconds */
        setInterval(nextSlide, 3000);

    </script>

</body>
</html>
