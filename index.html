
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PAR | Photography by Paniz Rafaghati</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
        }

        body {
            overflow: hidden;
        }

        .home {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100svh;
            min-height: 500px;
            overflow: hidden;
            background: #000;
        }

        .slideshow {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .slide.active {
            opacity: 1;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 2;
        }

        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: clamp(20px, 3vw, 35px) 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 25px;
            z-index: 10;
        }

        .logo {
            display: block;
            flex-shrink: 0;
        }

        .logo img {
            width: clamp(65px, 7vw, 90px);
            height: auto;
            display: block;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: clamp(15px, 2.5vw, 30px);
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: clamp(10px, 1vw, 13px);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            white-space: nowrap;
            transition: opacity 0.3s ease;
        }

        nav a:hover {
            opacity: 0.6;
        }

        /* Medium screens */

        @media (max-width: 900px) {
            header {
                padding: 25px 4%;
                gap: 18px;
            }

            nav {
                gap: 17px;
            }

            nav a {
                font-size: 11px;
                letter-spacing: 0.7px;
            }
        }

        /* Mobile screens */

        @media (max-width: 600px) {
            .home {
                min-height: 480px;
            }

            header {
                padding: 20px 5%;
                align-items: flex-start;
                gap: 12px;
            }

            .logo img {
                width: 62px;
            }

            nav {
                display: grid;
                grid-template-columns: repeat(3, auto);
                justify-content: end;
                gap: 15px 13px;
                max-width: calc(100% - 75px);
                padding-top: 5px;
            }

            nav a {
                font-size: 9px;
                letter-spacing: 0.5px;
                text-align: center;
            }

            .slide {
                background-position: center center;
            }

            .overlay {
                background: rgba(0, 0, 0, 0.3);
            }
        }

        /* Very small phones */

        @media (max-width: 360px) {
            header {
                padding: 16px 4%;
                gap: 8px;
            }

            .logo img {
                width: 52px;
            }

            nav {
                gap: 12px 9px;
                max-width: calc(100% - 60px);
            }

            nav a {
                font-size: 8px;
                letter-spacing: 0.3px;
            }
        }

        /* Landscape phones */

        @media (max-width: 900px) and (orientation: landscape) {
            header {
                padding: 12px 4%;
            }

            .logo img {
                width: 55px;
            }

            nav {
                gap: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .slide {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="home">

        <div class="slideshow">
            <div class="slide active" style="background-image: url('images/home1.jpg');"></div>
            <div class="slide" style="background-image: url('images/home2.jpg');"></div>
            <div class="slide" style="background-image: url('images/home3.jpg');"></div>
            <div class="slide" style="background-image: url('images/home4.jpg');"></div>
            <div class="slide" style="background-image: url('images/home5.jpg');"></div>
        </div>

        <div class="overlay"></div>

        <header>

            <a class="logo" href="index.html">
                <img src="logo.png" alt="PAR Logo">
            </a>

            <nav>
                <a href="index.html">Home</a>
                <a href="theatre.html">Theatre</a>
                <a href="projects.html">Project</a>
                <a href="about.html">About</a>
                <a href="https://paniz836.github.io/panizrafaghati.github.io/contact.html">Contact</a>
            </nav>

        </header>

    </main>

    <script>
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;

        if (slides.length > 1) {
            setInterval(() => {
                slides[currentSlide].classList.remove('active');

                currentSlide = (currentSlide + 1) % slides.length;

                slides[currentSlide].classList.add('active');
            }, 3000);
        }
    </script>

</body>
</html>
