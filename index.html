
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAR | Photography by Paniz Rafaghati</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .home {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }

        .slideshow {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 1.2s ease-in-out;
        }

        .slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.15);
            z-index: 2;
            pointer-events: none;
        }

        nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 28px 45px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .logo img {
            display: block;
            width: 90px;
            height: auto;
        }

        .menu {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 1px;
            transition: opacity 0.3s ease;
        }

        .menu a:hover {
            opacity: 0.55;
        }

        @media (max-width: 700px) {
            nav {
                padding: 20px;
            }

            .logo img {
                width: 65px;
            }

            .menu {
                gap: 14px;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .menu a {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <main class="home">

        <nav>
            <a href="index.html" class="logo">
                <img src="logo.png" alt="PAR Logo">
            </a>

            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="theatre.html">Theatre</a></li>
                <li><a href="projects.html">Project</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

        <div class="slideshow" id="slideshow">

            <img src="images/home1.jpg" class="slide" alt="Photography 1">
            <img src="images/home2.jpg" class="slide" alt="Photography 2">
            <img src="images/home3.jpg" class="slide" alt="Photography 3">
            <img src="images/home4.jpg" class="slide" alt="Photography 4">
            <img src="images/home5.jpg" class="slide" alt="Photography 5">

        </div>

        <div class="overlay"></div>

    </main>

    <script>
        const slideshow = document.getElementById("slideshow");
        const slides = document.querySelectorAll(".slide");

        let currentSlide = 0;

        function nextSlide() {
            currentSlide++;

            if (currentSlide >= slides.length) {
                currentSlide = 0;
            }

            slideshow.style.transform =
                "translateX(-" + (currentSlide * 100) + "%)";
        }

        setInterval(nextSlide, 3000);
    </script>

</body>
</html>
